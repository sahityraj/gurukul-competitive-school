
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o gurukul_competitive_school_mobile_build.zip -d /tmp/gurukul
          cp -r /tmp/gurukul/gurukul_competitive_school/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android --org com.gurukulcompetitive .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gurukul-Competitive-School-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
